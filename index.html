<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.BackButton?.hide();
const dev=new URLSearchParams(location.search).get('dev');let me,S={hist:[],cfg:{}};
const $=s=>document.querySelector(s),H=h=>($('#m').innerHTML=h);
async function api(p,o={}){const h={'x-init':tg?.initData||'','x-dev':dev||''},t=localStorage.tok;if(t)h.authorization='Bearer '+t;let b=o.body;
  if(b&&!(b instanceof FormData)){h['content-type']='application/json';b=JSON.stringify(b)}
  const r=await fetch('/api'+p,{method:o.body?'POST':'GET',headers:h,body:b});
  if(r.status==401){login();throw 0}if(r.status==402){gate();throw 0}if(r.status==403){alert("Bu funksiya sizga o'chirilgan");throw 0}return r.json()}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const POS={ot:'Ot',fel:"Fe'l",ravish:'Ravish',sifat:'Sifat'};
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.cancel();speechSynthesis.speak(u)}catch{}}
function playWord(w){if(w&&w.audio){new Audio('/audio/'+w.audio).play().catch(()=>speak(w.ko));return}if(w)speak(w.ko)}
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const D=ms=>ms>Date.now()?new Date(ms).toLocaleDateString():'—';
const has=p=>me.is_admin==2||(me.is_admin==1&&me.perms.split(',').includes(p));
const GR=[['#2f5fb3','#1f3f86'],['#2e8a69','#175c46'],['#d4543f','#a8321f'],['#d48a1c','#b0680c'],['#4a3f93','#2d2766'],['#0f8a9d','#0a5d6b']];
function confetti(n=34){const e=['🎉','⭐','✨','🎊','💛','🇰🇷'];for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.7+'s';s.style.fontSize=18+Math.random()*18+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}}
// ---------- navigatsiya (bitta "Orqaga" tugma)
function head(t,bk){S.bk=bk||null;$('#hd').innerHTML=bk?`<button class=backpill onclick="${bk}">← Orqaga</button><h1 class=pt>${t}</h1>`:''}
function nav(fn,...a){clearInterval(S.ti);S.hist.push([fn,a]);fn(...a)}
function back(){clearInterval(S.ti);S.hist.pop();const h=S.hist[S.hist.length-1];h?h[0](...h[1]):home()}
function resumeRun(){step(true)}
function leave(){clearInterval(S.ti);if(S.hist.length&&S.hist[S.hist.length-1][0]===resumeRun)S.hist.pop();const h=S.hist[S.hist.length-1];h[0](...h[1])}
async function login(){const c=await (await fetch('/config')).json();head('');H(`<div class=hero><i class=kr>안녕</i><h2>🇰🇷 Kores tili lug'ati</h2></div><div class=card><div>Davom etish uchun Google orqali kiring<div id=gb style="margin-top:10px"></div></div></div>${c.dev?'<p class=s>DEV: ?dev=ID bilan oching</p>':''}`);
  if(!c.google)return $('#gb').textContent='GOOGLE_CLIENT_ID sozlanmagan';
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{google.accounts.id.initialize({client_id:c.google,callback:async r=>{const x=await (await fetch('/auth/google',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:r.credential})})).json();if(x.token){localStorage.tok=x.token;init()}else alert('Kirish xatosi')}});google.accounts.id.renderButton($('#gb'),{theme:'outline',size:'large',text:'continue_with'})};document.body.appendChild(s)}
async function init(){try{me=await api('/me')}catch{return}S.cfg=await fetch('/config').then(r=>r.json()).catch(()=>({}));S.hist=[[home,[]]];await home();
  if(me.paid_until>0&&!me.active&&!me.is_admin)setTimeout(()=>sheet("⏰ Obuna muddatingiz tugadi. Davom etish uchun yangilang."),500)}
// ---------- bosh sahifa
function book(x,i){const g=GR[i%GR.length];return `<div class=book style="background:linear-gradient(145deg,${g[0]},${g[1]})" onclick="${x.ok?`nav(openDict,${x.id})`:'gate()'}"><h3>${esc(x.name)}</h3><small>${x.free?'Bepul':"Lug'at"}</small><span class=pill2>${x.ok?'✓':'🔒'} ${x.levels} daraja</span><i class=gh>${esc([...String(x.name)][0])}</i></div>`}

 const pl=level?[...new Set(R.filter(r=>r.level==level).map(r=>r.pos))]:[];
 const scope=(!level?tot:sum(r=>r.level==level&&(!pos||r.pos==pos)&&(!sec||r.section==sec)));

function run(mode,w){if(!w.length)return alert("Tanlangan bo'limda so'z topilmadi. «Butun kitob bo'yicha» tugmalarini sinab ko'ring yoki boshqa daraja/turni tanlang.");
 if(!S.hist.length||S.hist[S.hist.length-1][0]!==resumeRun)S.hist.push([resumeRun,[]]);
 S.run={mode,w:mode=='list'?w:shuf(w),i:0,score:0};if(mode=='life')S.run.lives=3;
 if(mode=='speed'){S.run.deadline=Date.now()+60000;S.ti=setInterval(()=>{const t=Math.max(0,Math.ceil((S.run.deadline-Date.now())/1000)),e=$('#tm');if(e)e.textContent='⏱ '+t;if(t<=0){clearInterval(S.ti);S.run.i=S.run.w.length;step()}},500)}step()}

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
const sim=(a,b)=>{a=a.replace(/[\s.,!?]/g,'');b=b.replace(/[\s.,!?]/g,'');return 1-lev(a,b)/Math.max(a.length,b.length,1)};

 const w=r.w[r.i];
 if(r.mode=='list')return H(r.w.map(x=>`<div class=card><div><b>${esc(x.ko)}</b><br><small>${esc(x.uz)}</small></div><button class=pill onclick="playWord(S.run.w.find(z=>z.id==${x.id}))">🔊</button>${lrn(x)}</div>`).join(''));
 if(!w||(r.mode=='life'&&r.lives<=0)){clearInterval(S.ti);if(!r.sent){r.sent=1;api('/score',{body:{points:r.score}}).catch(()=>{});confetti()}return H(`${mas("Zo'r natija! 🎉")}<div class=sticker>🏆 ${r.score}${r.mode=='speed'?' ball':' / '+r.w.length}</div><button class=nxt onclick="leave()">Davom etish ➜</button>`)}
 const pr=r.mode=='speed'?`<div class=sp2><b id=tm>⏱ 60</b><span>⭐ ${r.score}</span></div>`:r.mode=='life'?`<div class=sp2><b>${'❤️'.repeat(r.lives)}${'🖤'.repeat(3-r.lives)}</b><span>⭐ ${r.score}</span></div>`:`<div class=pb><i style="width:${Math.round(r.i/r.w.length*100)}%"></i></div>`;
 const nx='<button class=nxt onclick="S.run.i++;step()">Keyingi ➜</button>';

 if(['test','listen','speed','life','gram'].includes(r.mode)){const o=r.o&&r.oi==r.i?r.o:(r.o=w.opts?shuf(w.opts):opts(w),r.oi=r.i,r.o);if(r.mode=='listen'&&!keep)setTimeout(()=>playWord(cur()),250);
  const top=r.mode=='listen'?mas("Quloq sol 👂 va to'g'ri tarjimani tanla!")+`<div class=spk onclick="playWord(cur())"><i>🔊</i><b></b><b></b></div>`:`<div class=sticker>${esc(w.ko)}${w.h?`<small>${esc(w.h)}</small>`:`<button class=pill onclick="playWord(cur())">🔊</button>`}</div>`;

 if(r.mode=='speak')return H(pr+mas('Mikrofonni bosib koreyschasini ayt! 🎤')+`<div class=sticker>${esc(w.uz)}<small>koreyschada qanday?</small></div><div class=row><button class=pill onclick="playWord(cur())">🔊 Namuna</button>${lrn(w)}</div><div class=micwrap><button id=mic class=mic onclick="listen()"><i>🎤</i><b>Gapirish</b></button><div class=wave><s></s><s></s><s></s><s></s><s></s></div></div><div id=hr class=res></div>${nx}`)}

function matchStart(w){const p=shuf(w).slice(0,6);S.m={p,ko:shuf(p),uz:shuf(p),sel:null,done:new Set(),miss:0};matchV()}
function matchV(){const m=S.m;head('Juftlik','leave()');const bt=(x,s,t)=>`<button class="opt2 ${m.done.has(x.id)?'ok':''}" ${s&&m.sel==x.id?'style="border-color:#f5a623"':''} onclick="mpick(${x.id},'${s?'k':'u'}')">${esc(t)}</button>`;
 H(`<div class=s>Avval koreyscha so'zni, so'ng tarjimasini bosing</div><div class=tiles><div>${m.ko.map(x=>bt(x,1,x.ko)).join('')}</div><div>${m.uz.map(x=>bt(x,0,x.uz)).join('')}</div></div>`)}
function mpick(id,s){const m=S.m;if(m.done.has(id))return;if(s=='k'){m.sel=id;return matchV()}if(m.sel==null)return;
 if(m.sel==id)m.done.add(id);else m.miss++;m.sel=null;

 <select id=bs><option value=equal>Darajalarga teng bo'lish</option><option value=custom>Har daraja uchun so'z sonini o'zim yozaman</option><option value=level>Hammasi bitta darajaga</option></select><input id=bc placeholder="So'z soni: 200,300,300"><input id=bv type=number placeholder="Qaysi daraja (faqat «bitta daraja» uchun)"><select id=bp>${posOpts('ot')}</select>

 if(has('dicts'))sec.push(`<div class=card><b>📖 Kitoblarni boshqarish</b><div class=s>Nomi · daraja soni · bo'limdagi so'z soni</div>${d.map(x=>`<div class=card style="display:block;margin:6px 0"><input id=dn${x.id} value="${esc(x.name)}"><div class=edr><input id=dl${x.id} type=number value=${x.levels}><input id=ds${x.id} type=number value=${x.sec||30}><button class=cb onclick="adm('/dict/${x.id}',{name:$('#dn${x.id}').value,levels:$('#dl${x.id}').value,sec:$('#ds${x.id}').value})">💾</button><button class="cb ${x.free?'on':''}" onclick="adm('/dict/${x.id}',{free:${x.free?0:1}})">${x.free?'🆓':'💰'}</button><button class="cb red" onclick="delDict(${x.id})">🗑</button></div></div>`).join('')}
 <b>➕ Bo'sh kitob</b><input id=dn0 placeholder="Nomi"><div class=edr><input id=dl0 type=number placeholder="Daraja soni"><input id=ds0 type=number placeholder="Bo'limda so'z (30)"></div><button class=big2 onclick="adm('/dict',{name:$('#dn0').value,levels:$('#dl0').value,sec:$('#ds0').value})">Qo'shish</button></div>`);
 if(has('import'))sec.push(`<div class=card><b>📥 Faylni kitobga qo'shish</b><div class=s>Har qanday fayl: .txt .csv .xlsx .docx .pdf .html — «koreys - tarjima» qatorlari olinadi, tarjimasizlari avtomatik tarjima qilinadi.</div><select id=id>${ops}</select><div class=edr><input id=il type=number value=1><select id=ip>${posOpts('ot')}</select></div><label><input type=checkbox id=ia style="width:auto"> So'z turini avto-aniqlash</label><input type=file id=if accept=".txt,.csv,.xlsx,.xls,.docx,.pdf,.html,.htm"><button class=big2 onclick="imp()">📥 Yuklash</button></div>`);
 if(has('tasks'))sec.push(`<div class=card><b>📝 Topshiriq yaratish</b><select id=td>${ops}</select><div class=edr><input id=tl type=number value=1 placeholder="Daraja"><select id=tp><option value="">Barcha turlar</option>${posOpts('')}</select><input id=tsc type=number placeholder="Bo'lim"></div><input id=tt placeholder="Topshiriq nomi"><button class=big2 onclick="adm('/task',{dict_id:$('#td').value,level:$('#tl').value,pos:$('#tp').value,section:$('#tsc').value,title:$('#tt').value})">➕ Qo'shish</button></div>`);
 if(has('users')||has('admins')){const us=await api('/admin/users');sec.push(`<div class=card><b>👥 Foydalanuvchilar (${us.length})</b>`+(has('admins')?`<div class=addrow><input id=ae placeholder="Email bo'yicha admin qo'shish"><button class=big2 onclick="adm('/admin',{email:$('#ae').value,admin:1})">➕</button></div>`:'')+us.map(u=>`<div class=card style="display:block;margin:6px 0"><b>${esc(u.name)}</b> ${u.is_admin==2?'👑':u.is_admin?'🛡':''}<div class=s>${esc(u.email||'TG '+u.id)} · obuna: ${D(u.paid_until)} · sinov: ${u.trial}</div>`+(has('users')?`<button class="b g" onclick="adm('/user',{id:${u.id},months:1})">+1 oy</button><button class="b g" onclick="adm('/user',{id:${u.id},months:3})">+3 oy</button>`:'')+(has('admins')&&u.is_admin!=2?`<details class=grp><summary>🛡 Admin funksiyalari</summary><div style="padding:8px 14px">${me.PERMS.map(p=>`<label style="display:block;padding:4px 0"><input type=checkbox class=pm${u.id} value=${p} ${u.perms.split(',').includes(p)?'checked':''} style="width:auto"> ${p}</label>`).join('')}<button class=big2 onclick="adm('/admin',{id:${u.id},admin:1,perms:[...document.querySelectorAll('.pm${u.id}:checked')].map(x=>x.value)})">${u.is_admin?'💾 Saqlash':'🛡 Admin qilish'}</button>${u.is_admin?`<button class="b g" onclick="adm('/admin',{id:${u.id},admin:0})">Adminlikni olish</button>`:''}</div></details>`:'')+'</div>').join('')+'</div>')}
 if(has('admins')){const st=await api('/admin/status');sec.push(`<div class=card><b>🔧 Holat va sinov</b><div class=rk><span>Claude kaliti</span><b>${st.key?'✅ ulangan ('+st.keyLen+' belgi)':'❌ yo\'q'}</b></div><div class=rk><span>Model</span><b>${esc(st.model)}</b></div><div class=rk><span>Bot tokeni</span><b>${st.bot?'✅':'❌'}</b></div><div class=rk><span>WEBAPP_URL</span><b>${st.webapp?'✅':'❌'}</b></div><div class=rk><span>Doimiy disk</span><b>${esc(st.data)}</b></div><button class=big2 onclick="claudeTest()">🧪 Claude'ni sinash</button><p class=s>Kalit ❌ bo'lsa: Railway → Variables → ANTHROPIC_API_KEY qo'shing va Deploy bosing. Ikkita loyiha bo'lsa, domen bog'langan loyihaga qo'shing.</p></div>`)}
 S.adm=sec;
 if(S.admOpen!=null&&sec[S.admOpen]){head('Sozlamalar','admBack()');H(`<div class=admwrap>${sec[S.admOpen]}</div>`);if(sec[S.admOpen].includes('id=vd'))setTimeout(()=>$('#vd')&&vTree(),60);return}
 head('Sozlamalar','back()');const G2=['#7b5cff,#e0508a','#2e8a69,#0f8a9d','#ff8a5c,#e0508a','#d48a1c,#f5c05a','#2f5fb3,#4a3f93','#0f8a9d,#2f5fb3'];
 H(`<div class=hero><i class=kr>설정</i><small>Boshqaruv paneli</small><h2>⚙️ Sozlamalar</h2></div><div class=tiles>`+sec.map((h,i)=>{const t=(h.match(/<b>(.*?)<\/b>/)||[0,"📦 Bo'lim"])[1],sp=t.indexOf(' ');return `<div class=tile style="background:linear-gradient(145deg,${G2[i%G2.length]})" onclick="S.admOpen=${i};vAdmin()"><em>${t.slice(0,sp)}</em><b>${t.slice(sp+1)}</b></div>`}).join('')+'</div>')}
// ---------- ovoz yozish: kitob → daraja → tur → bo'lim
const VW={};
function voiceCard(d){return `<div class=card><b>🎙 Ovoz yozish</b><div class=s>Kitob → daraja → so'z turi → bo'lim tanlang, so'ng har bir so'z uchun ovozingizni yozing. Foydalanuvchi «Tinglash»da sizning ovozingizni eshitadi.</div><select id=vd onchange="vTree()">${d.map(x=>`<option value=${x.id}>${esc(x.name)}</option>`).join('')}</select><select id=vl onchange="vTree(1)"></select><select id=vp onchange="vTree(2)"></select><select id=vs></select><button class=big2 onclick="loadVoice()">📋 So'zlarni ko'rsat</button><div id=vlist></div></div>`}
async function vTree(stage){const id=$('#vd').value;if(!id)return;if(!S.vt||S.vt.id!=id||!stage){const t=await api('/tree/'+id);S.vt={id,rows:t.rows}}
 const R=S.vt.rows,lv=[...new Set(R.map(r=>r.level))].sort((a,b)=>a-b);
 if(!stage)$('#vl').innerHTML='<option value="">Barcha darajalar</option>'+lv.map(l=>`<option>${l}</option>`).join('');
 const L=$('#vl').value,pp=[...new Set(R.filter(r=>!L||r.level==L).map(r=>r.pos))];
 if(stage!=2)$('#vp').innerHTML='<option value="">Barcha turlar</option>'+pp.map(p=>`<option value="${esc(p)}">${esc(POS[p]||p)}</option>`).join('');
 const P=$('#vp').value,ss=[...new Set(R.filter(r=>(!L||r.level==L)&&(!P||r.pos==P)).map(r=>r.section))].sort((a,b)=>a-b);
 $('#vs').innerHTML='<option value="">Barcha bo\'limlar</option>'+ss.map(s=>`<option value=${s}>${s}-bo'lim</option>`).join('')}
function voiceRow(x){return `<div class=vrow id=vr${x.id}><div><b>${esc(x.ko)}</b><small>${esc(x.uz)}</small></div><div>${x.audio?`<button class="cb play" onclick="new Audio('/audio/${x.audio}').play()">▶</button>`:''}<button class="cb mic ${x.audio?'done':''}" onclick="recWord(${x.id},this)">${x.audio?'🔁':'🎙'}</button></div></div>`}
async function loadVoice(){const p=new URLSearchParams({dict:$('#vd').value,level:$('#vl').value,pos:$('#vp').value,section:$('#vs').value});const w=await api('/words?'+p);w.forEach(x=>VW[x.id]=x);
 $('#vlist').innerHTML=w.slice(0,200).map(voiceRow).join('')||'<p class=s>So\'z yo\'q</p>'}
async function recWord(id,btn){if(S.rec){S.rec.stop();return}
 if(!navigator.mediaDevices||!window.MediaRecorder)return alert("Bu qurilmada ovoz yozib bo'lmaydi");
 const st=await navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>null);if(!st)return alert("Mikrofonga ruxsat bering");
 const mr=new MediaRecorder(st),ch=[];S.rec=mr;btn.textContent='⏹';btn.classList.add('live');
 mr.ondataavailable=e=>ch.push(e.data);
 mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());S.rec=null;btn.classList.remove('live');btn.textContent='⏳';
  const fd=new FormData();fd.append('audio',new Blob(ch,{type:mr.mimeType||'audio/webm'}),'v');
  try{const r=await api('/admin/word/'+id+'/audio',{body:fd});VW[id].audio=r.audio}catch{}
  const e=$('#vr'+id);if(e)e.outerHTML=voiceRow(VW[id])};
 mr.start();setTimeout(()=>S.rec&&S.rec.stop(),15000)}
const impMsg=r=>r.found==0?"Faylda koreyscha so'z topilmadi. Fayl matn bo'lishi kerak (rasm yoki skan qilingan PDF o'qilmaydi).":`${r.added} ta so'z qo'shildi (${r.translated} ta avto-tarjima)`+(r.skipped?`\n⚠️ ${r.skipped} ta so'z tarjimasiz o'tkazildi. ANTHROPIC_API_KEY qo'shsangiz avtomatik tarjima qilinadi.`:'')+'\n'+Object.entries(r.perLevel||{}).map(([l,n])=>`${l}-daraja: ${n} ta`).join(', ')+'\n'+ptxt(r);
const ptxt=r=>Object.entries(r.perPos||{}).map(([p,n])=>`${POS[p]||p}: ${n}`).join(', ');
function watchJob(id){document.getElementById('ov')?.remove();const o=document.createElement('div');o.id='ov';
 o.innerHTML=`<div class=bg></div><div class=sh><h2 style="margin:0 0 6px">⏳ So'zlar qo'shilmoqda</h2><div class=s id=jst>Boshlanmoqda...</div><div class=pb><i id=jbar style="width:5%"></i></div><div id=jtx class=s></div><button class=nxt onclick="document.getElementById('ov').remove()">Yopish (fonda davom etadi)</button></div>`;document.body.appendChild(o);
 const tick=async()=>{let j;try{j=await api('/admin/job/'+id)}catch{return}if(!document.getElementById('ov'))return;
  $('#jst').textContent=j.stage;$('#jbar').style.width=Math.max(5,j.total?Math.round(j.done/j.total*100):5)+'%';$('#jtx').textContent=`${j.done}/${j.total} · ${j.added} ta qo'shildi`;
  if(j.fin){document.getElementById('ov').remove();if(j.err)alert('Xatolik: '+j.err);else{confetti();alert((j.dict_id?'Kitob yaratildi.\n':'')+impMsg(j))}vAdmin();return}
  setTimeout(tick,1200)};tick()}
async function createBook(){const f=$('#bf').files[0];if(!f||!$('#bn').value.trim())return alert('Kitob nomi va faylni kiriting');const fd=new FormData();
 fd.append('name',$('#bn').value);fd.append('levels',$('#bl').value||1);fd.append('sec',$('#bsc').value||30);fd.append('split',$('#bs').value);fd.append('counts',$('#bc').value);fd.append('level',$('#bv').value);fd.append('pos',$('#bp').value);fd.append('auto',$('#ba').checked?1:0);fd.append('file',f);
 const r=await api('/admin/book',{body:fd});watchJob(r.job)}
async function imp(){const f=$('#if').files[0];if(!f)return;const fd=new FormData();fd.append('dict_id',$('#id').value);fd.append('level',$('#il').value);fd.append('pos',$('#ip').value);fd.append('auto',$('#ia').checked?1:0);fd.append('file',f);const r=await api('/admin/import',{body:fd});watchJob(r.job)}
async function claudeTest(){const r=await api('/admin/claude-test',{body:{}});alert(r.ok?`✅ Ishlayapti! Javob: ${r.reply}\nModel: ${r.model}`:'❌ Xato: '+r.error)}
init();
</script></body></html>
