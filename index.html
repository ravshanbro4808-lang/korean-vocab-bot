function leave(){clearInterval(S.ti);if(S.hist.length&&S.hist[S.hist.length-1][0]===resumeRun)S.hist.pop();const h=S.hist[S.hist.length-1];h[0](...h[1])}

async function openDict(id,level,pos,sec){S.hist[S.hist.length-1]=[openDict,[id,level,pos,sec]];const t=await api('/tree/'+id);S.lvn[id]=t.levels||[];head(esc(t.d.name),'back()');
 const R=t.rows,sum=f=>R.filter(f).reduce((a,r)=>a+r.n,0),tot=sum(()=>true),dm=n=>n?'':' style="opacity:.4"';
 const M=[['cards','🃏 Kartochka'],['test','❓ Test'],['listen','🎧 Eshitish'],['speak','🎤 Gapirish'],['chat','💬 Suhbat'],['list',"📖 Ro'yxat"]];
 const pl=level?[...new Set(R.filter(r=>r.level==level).map(r=>r.pos))]:[];
 const scope=(!level?tot:sum(r=>r.level==level&&(!pos||r.pos==pos)&&(!sec||r.section==sec)));
 H(`<div class=hero2><b>${tot}</b> ta so'z · ${(t.levels||[]).length} daraja <button class=pill onclick="nav(wordsView,${id})" style="margin-left:8px">📖 So'zlar</button></div>`+
 (tot?`<div class=s>BUTUN KITOB BO'YICHA</div><div>${M.map(m=>`<button class=b onclick="start('${m[0]}',${id},'','',0)">${m[1]}</button>`).join('')}</div>`:`<div class=card><div>Bu kitobda hali so'z yo'q. Admin paneldan fayl yuklang.</div></div>`)+
 `<hr><div class=s>DARAJANI TANLANG</div>`+(t.levels||[]).map(l=>{const n=sum(r=>r.level==l.level);return `<button class="b ${level==l.level?'':'g'}"${dm(n)} onclick="openDict(${id},${l.level})">${esc(l.name)} (${n})</button>`}).join('')+
 (level?`<div class=s>SO'Z TURI</div><button class="b ${!pos?'':'g'}" onclick="openDict(${id},${level},'')">Barchasi (${sum(r=>r.level==level)})</button>`+pl.map(p=>`<button class="b ${pos==p?'':'g'}" onclick="openDict(${id},${level},'${esc(p)}')">${esc(POS[p]||p)} (${sum(r=>r.level==level&&r.pos==p)})</button>`).join(''):'')+
 (level&&pos!=null?`<div class=s>BO'LIM</div><button class="b ${!sec?'':'g'}" onclick="openDict(${id},${level},'${esc(pos)}',0)">Barchasi</button>`+[...new Set(R.filter(r=>r.level==level&&(!pos||r.pos==pos)).map(r=>r.section))].sort((a,b)=>a-b).map(s=>`<button class="b ${sec==s?'':'g'}" onclick="openDict(${id},${level},'${esc(pos)}',${s})">${s}-bo'lim (${sum(r=>r.level==level&&(!pos||r.pos==pos)&&r.section==s)})</button>`).join('')+
 `<hr><div class=s>TANLANGAN: ${scope} ta so'z · qaysi so'zlar:</div><select id=wm><option value="">Hammasi</option><option value=new>Yangi</option><option value=learned>O'rganilgan (takrorlash)</option></select><div>${M.map(m=>`<button class=b onclick="start('${m[0]}',${id},${level},'${esc(pos)}',${sec||0})">${m[1]}</button>`).join('')}</div>`:'')+
 (tot?`<hr><div class=s>SO'Z TURKUMLARI (butun kitob bo'yicha)</div><div class=posch>${posAll(R).map(p=>`<button class="b g"${p.n?'':' style="opacity:.4"'} onclick="nav(wordsView,${id},'${esc(p.key)}')">${esc(p.name)} (${p.n})</button>`).join('')}</div>`:''))}
function posAll(R){const cnt={};R.forEach(r=>cnt[r.pos]=(cnt[r.pos]||0)+r.n);const keys=POSL.map(x=>x.key);Object.keys(cnt).forEach(k=>{if(!keys.includes(k))keys.push(k)});return keys.map(k=>({key:k,name:POS[k]||k,n:cnt[k]||0}))}

function cardChoose(){head('Kartochkalar','leave()');const n=S.cw.length;
 H(`${mas("Kartochka turini tanlang!")}<div class=tiles style="grid-template-columns:1fr"><div class=tile style="background:linear-gradient(145deg,#4a78d4,#2b9a8a);padding-right:96px;min-height:110px" onclick="runCards('rect')"><em>▭</em><b>Oddiy kartochkalar</b><small>${n} ta so'z · to'rtburchak</small></div><div class=tile style="background:linear-gradient(145deg,#e0508a,#ff9f43);padding-right:96px;min-height:110px" onclick="runCards('shapes')"><em style="font-size:30px;right:10px">🌙🌸</em><b>Har xil shakldagi kartochkalar</b><small>oy, gul, doira, oval, yurak...</small></div></div>`)}

const CPAL=[['#ff6b6b','#ee5a9b'],['#ff9f43','#f6c23e'],['#2ed573','#1abc9c'],['#1e90ff','#48dbfb'],['#a55eea','#6c5ce7'],['#fd79a8','#e17055'],['#00b894','#0984e3'],['#e84393','#fdcb6e'],['#6c5ce7','#00cec9'],['#ff7675','#fdcb6e']];
const BURSTPTS='50% 0%,61.8% 6.1%,75% 6.7%,82.2% 17.8%,93.3% 25%,93.9% 38.2%,100% 50%,93.9% 61.8%,93.3% 75%,82.2% 82.2%,75% 93.3%,61.8% 93.9%,50% 100%,38.2% 93.9%,25% 93.3%,17.8% 82.2%,6.7% 75%,6.1% 61.8%,0% 50%,6.1% 38.2%,6.7% 25%,17.8% 17.8%,25% 6.7%,38.2% 6.1%';
const SH=(()=>{const st='fill="FILL" stroke="#ffffff99" stroke-width="1.4"';

 const bp=BURSTPTS.split(',').map(p=>p.trim().split(' ').map(v=>parseFloat(v)).join(',')).join(' ');
 return {
 circle:{vb:'0 0 100 100',ar:'1/1',box:[18,18,64,64],svg:`<circle cx="50" cy="50" r="48" ${st}/>`},
 oval:{vb:'0 0 100 100',ar:'4/3',box:[15,19,70,62],svg:`<ellipse cx="50" cy="50" rx="48" ry="48" ${st}/>`},
 moon:{vb:'0 0 100 100',ar:'1/1',box:[14,36,42,44],svg:`<defs><mask id="MID"><rect width="100" height="100" fill="#fff"/><circle cx="84" cy="30" r="28" fill="#000"/></mask></defs><circle cx="50" cy="50" r="48" mask="url(#MID)" fill="FILL"/>`},
 flower:{vb:'0 0 100 100',ar:'1/1',box:[24,24,52,52],svg:`${pet}<circle cx="50" cy="50" r="31" fill="FILL"/><circle cx="50" cy="50" r="27" fill="#0000001f"/>`},
 heart:{vb:'0 0 100 100',ar:'1/1',box:[18,27,64,36],svg:`<path d="M50 92C20 70 5 51 5 32 5 17 17 7 29 7 38 7 46 12 50 21 54 12 62 7 71 7 83 7 95 17 95 32 95 51 80 70 50 92Z" ${st}/>`},
 burst:{vb:'0 0 100 100',ar:'1/1',box:[19,19,62,62],svg:`<polygon points="${bp}" ${st}/>`},
 hexagon:{vb:'0 0 100 100',ar:'1/1',box:[17,24,66,52],svg:`<polygon points="50,2 93,26 93,74 50,98 7,74 7,26" ${st}/>`},
 cloud:{vb:'0 14 100 76',ar:'100/76',box:[24,34,62,53],svg:`<g fill="FILL"><circle cx="27" cy="62" r="19"/><circle cx="46" cy="44" r="24"/><circle cx="70" cy="50" r="22"/><circle cx="80" cy="64" r="16"/><rect x="18" y="60" width="70" height="22" rx="11"/></g>`}}})();
const SHK=['moon','flower','circle','oval','heart','burst','hexagon','cloud'];
function cardFace(i,side,txt,kind){const p=CPAL[(i+(side=='k'?4:0))%CPAL.length],sty=`--c1:${p[0]};--c2:${p[1]}`;
 if(kind=='rect')return `<div class="cdf ${side}" style="${sty}"><div class=bgr></div><div class=ct style="left:6%;top:8%;width:88%;height:84%"><b class=tx2>${esc(txt)}</b></div></div>`;
 const sh=SH[SHK[i%SHK.length]],id='g'+i+side,fill=`url(#${id})`;
 const svg=sh.svg.replace(/FILL/g,fill).replace(/MID/g,'m'+id);
 return `<div class="cdf ${side}"><svg class=bg viewBox="${sh.vb}" preserveAspectRatio="none"><defs><linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs>${svg}</svg><div class=ct style="left:${sh.box[0]}%;top:${sh.box[1]}%;width:${sh.box[2]}%;height:${sh.box[3]}%"><b class=tx2>${esc(txt)}</b></div></div>`}
function cardHTML(r,w){const kind=r.shape,sh=kind=='rect'?{ar:'3/2'}:SH[SHK[r.i%SHK.length]];
 return `<div class=cdw id=cdw style="--ar:${sh.ar}" onclick="if(Date.now()-(window._sw||0)>400)this.classList.toggle('on')"><div class=cdi>${cardFace(r.i,'f',w.ko,kind)}${cardFace(r.i,'k',w.uz,kind)}</div></div>`}

function fitCd(){document.querySelectorAll('.cdf .ct').forEach(ct=>{const el=ct.firstElementChild;if(!el||!ct.clientWidth)return;const bad=()=>el.scrollHeight>ct.clientHeight+1||el.scrollWidth>ct.clientWidth+1;let fs=46;el.style.overflowWrap='normal';el.style.fontSize=fs+'px';while(bad()&&fs>11){fs-=1;el.style.fontSize=fs+'px'}
 if(bad()){el.style.overflowWrap='anywhere';fs=30;el.style.fontSize=fs+'px';while(bad()&&fs>9){fs-=1;el.style.fontSize=fs+'px'}}})}
const WD={};
function wrow(x){return `<div class=wr id=wr${x.id}><span><b>${esc(x.ko)}</b> <small>${esc(x.uz)}</small></span><span><button class=cb onclick="playWord(WD[${x.id}])">🔊</button>${has('dicts')?`<button class=cb onclick="editWord(${x.id})">✏️</button>`:''}</span></div>`}
async function wordsView(id,pf){head("Barcha so'zlar",'back()');const [w,t]=await Promise.all([api('/words?dict='+id),api('/tree/'+id)]);S.lvn[id]=t.levels||[];S.wvd=id;w.forEach(x=>WD[x.id]=x);
 const all=w,cnt={};all.forEach(x=>cnt[x.pos]=(cnt[x.pos]||0)+1);const list=pf?all.filter(x=>x.pos==pf):all;const g={};list.forEach(x=>{const k=x.level+'|'+x.pos+'|'+x.section;(g[k]=g[k]||[]).push(x)});
 const keys=posAll(t.rows);
 const chips=`<div class=posch><button class="b ${pf?'g':''}" onclick="wordsView(${id},'')">Barchasi (${all.length})</button>${keys.map(p=>`<button class="b ${pf==p.key?'':'g'}"${cnt[p.key]?'':' style="opacity:.4"'} onclick="wordsView(${id},'${esc(p.key)}')">${esc(p.name)} (${cnt[p.key]||0})</button>`).join('')}</div>`;
 H(`<div class=s>SO'Z TURKUMI BO'YICHA FILTR</div>${chips}`+(Object.keys(g).sort((a,b)=>{const A=a.split('|'),B=b.split('|');return A[0]-B[0]||A[1].localeCompare(B[1])||A[2]-B[2]}).map(k=>{const [l,p,s]=k.split('|');return `<details class=grp ${pf?'open':''}><summary>${esc(lname(id,+l))} · ${esc(POS[p]||p)} · ${s}-bo'lim <b>${g[k].length}</b></summary>${g[k].map(wrow).join('')}</details>`}).join('')||'<p class=s>So\'z yo\'q</p>')+
 `<hr><div class=s>SO'Z TURKUMLARI (ro'yxat pastida)</div>${chips}`)}
function editWord(id){const x=WD[id];$('#wr'+id).innerHTML=`<div class=ed style="width:100%"><input id=ek value="${esc(x.ko)}"><input id=eu value="${esc(x.uz)}"><div class=edr><select id=ep>${Object.entries(POS).map(([k,v])=>`<option value=${k} ${x.pos==k?'selected':''}>${v}</option>`).join('')}</select><select id=elv>${(S.lvn[S.wvd]||[]).map(l=>`<option value=${l.level} ${x.level==l.level?'selected':''}>${esc(l.name)}</option>`).join('')}</select><button class=cb onclick="saveWord(${id})">💾</button><button class="cb red" onclick="delWord(${id})">🗑</button></div></div>`}

async function start(mode,dict,level,pos,sec){const p=new URLSearchParams({dict,level,pos,section:sec||'',mode:$('#wm')?.value||''});const w=await api('/words?'+p);if(mode=='chat'){if(!w.length)return alert("So'z yo'q");return nav(foxChat,shuf(w).slice(0,20))}run(mode,w)}
function run(mode,w){if(!w.length)return alert("Tanlangan bo'limda so'z topilmadi. «Butun kitob bo'yicha» tugmalarini sinab ko'ring yoki boshqa daraja/turni tanlang.");
 if(mode=='cards'&&!S.cardGo){S.cw=w;return cardChoose()}S.cardGo=0;
 if(!S.hist.length||S.hist[S.hist.length-1][0]!==resumeRun)S.hist.push([resumeRun,[]]);
 S.run={mode,w:mode=='list'?w:shuf(w),i:0,score:0};if(mode=='life')S.run.lives=3;
 if(mode=='speed'){S.run.deadline=Date.now()+60000;S.ti=setInterval(()=>{const t=Math.max(0,Math.ceil((S.run.deadline-Date.now())/1000)),e=$('#tm');if(e)e.textContent='⏱ '+t;if(t<=0){clearInterval(S.ti);S.run.i=S.run.w.length;step()}},500)}step()}

const cur=()=>S.run.w[S.run.i];
const mas=m=>`<div class=mas><i>🦊</i><span>${m}</span></div>`;
const lrn=w=>w.g?'':`<button class="lrn ${w.learned?'on':''}" onclick="mark(${w.id},${w.learned?0:1})">${w.learned?"✅ O'rganildi":"⭐ O'rgandim"}</button>`;
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
const sim=(a,b)=>{a=a.replace(/[\s.,!?]/g,'');b=b.replace(/[\s.,!?]/g,'');return 1-lev(a,b)/Math.max(a.length,b.length,1)};
async function mark(id,on){const x=S.run.w.find(w=>w.id==id);await api(x&&x.tp?'/topik/learned':'/learned',{body:{id,on}});x.learned=on;if(on)confetti(10);step(true)}

const foxBtn='<button class="pill fx" onclick="ask1()">🦊 Tulkidan so\'ra</button>';
function step(keep){const r=S.run;head('Mashq','leave()');r.ans=null;if(r.mode=='speed'&&r.i>=r.w.length&&Date.now()<r.deadline){r.w=shuf(r.w);r.i=0}
 const w=r.w[r.i];
 if(r.mode=='list')return H(r.w.map(x=>`<div class=card><div><b>${esc(x.ko)}</b><br><small>${esc(x.uz)}</small></div><button class=pill onclick="playWord(S.run.w.find(z=>z.id==${x.id}))">🔊</button>${lrn(x)}</div>`).join(''));
 if(!w||(r.mode=='life'&&r.lives<=0)){clearInterval(S.ti);if(!r.sent){r.sent=1;api('/score',{body:{points:r.score}}).catch(()=>{});confetti()}return H(`${mas("Zo'r natija! 🎉")}<div class=sticker>🏆 ${r.score}${r.mode=='speed'?' ball':' / '+r.w.length}</div><button class=nxt onclick="leave()">Davom etish ➜</button>`)}

 const L=[`${r.added} ta so'z qo'shildi (${r.translated} ta avto-tarjima)`];
 if(r.pages)L.push(`📄 ${r.pages} ta sahifa tekshirildi · topilgan so'z: ${r.found}${r.expected?' (taxminan kutilgan: '+r.expected+')':''}`);else L.push(`Topilgan so'z: ${r.found}`);
 if(r.dups)L.push(`♻️ ${r.dups} ta takroriy so'z aniqlandi`);
 if(r.skipped)L.push(`⚠️ ${r.skipped} ta so'z tarjimasiz o'tkazildi. GEMINI_API_KEY qo'shsangiz avtomatik tarjima qilinadi.`);
 const ep=r.emptyPages||[],fp=r.failedPages||[];
 if(ep.length)L.push(`⚠️ O'qilmagan/bo'sh sahifalar (${ep.length}): ${ep.slice(0,40).join(', ')}${ep.length>40?'...':''}`);
 if(fp.length)L.push(`⚠️ Xato bilan o'tkazib yuborilgan sahifalar (${fp.length}): ${fp.slice(0,40).join(', ')}${fp.length>40?'...':''}`);
 (r.warn||[]).forEach(x=>L.push('⚠️ '+x));
 if(r.incomplete)L.push("❗ Natija TO'LIQ EMAS — yuqoridagi sahifalarni qayta yuklab ko'ring (aniqroq sifat yoki alohida fayl qilib).");
 else if(r.pages&&!ep.length&&!fp.length&&!(r.warn||[]).length)L.push("✅ Barcha sahifalar o'qildi.");
 L.push(Object.entries(r.perLevel||{}).map(([l,n])=>`${lname(r.dict_id||0,+l)}: ${n} ta`).join(', '));L.push(ptxt(r));return L.filter(Boolean).join('\n')};
